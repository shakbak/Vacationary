spring.application.name=backend
server.port=8080

spring.datasource.url=jdbc:h2:mem:vacationary;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

vacationary.llm.base-url=${VACATIONARY_LLM_BASE_URL:https://api.groq.com/openai/v1}
vacationary.llm.model=${VACATIONARY_LLM_MODEL:openai/gpt-oss-20b}
vacationary.llm.api-key=${VACATIONARY_LLM_API_KEY:}

