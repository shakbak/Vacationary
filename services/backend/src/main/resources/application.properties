spring.application.name=backend
server.port=8080

spring.datasource.url=jdbc:h2:mem:vacationary;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

vacationary.llm.base-url=https://api.openai.com/v1
vacationary.llm.model=gpt-4o-mini
vacationary.llm.api-key=${VACATIONARY_LLM_API_KEY:}

